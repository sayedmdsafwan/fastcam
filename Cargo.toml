[package]
name = "fastcam"
version = "1.0.0"
edition = "2024"
description = "A tiny, fast webcam app for Windows: live preview, photos and MP4 video with microphone audio"
repository = "https://github.com/sayedmdsafwan/fastcam"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
nokhwa = { version = "0.10", features = ["input-native"] }
softbuffer = "0.4"
windows = { version = "0.61", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
winit = "0.30"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true